services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: todo-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: todo-backend:latest
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL through GitHub Actions secrets}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB through GitHub Actions secrets}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER through GitHub Actions secrets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD through GitHub Actions secrets}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - app

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN through GitHub Actions secrets}
    restart: unless-stopped
    depends_on:
      - frontend
    networks:
      - app

networks:
  app:
    name: todo-production

volumes:
  postgres_data:
    name: todo_postgres_data
